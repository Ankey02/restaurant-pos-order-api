services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_pw
      POSTGRES_DB: restaurant
    ports:
      - "5434:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables the Scalar UI for demos
      ConnectionStrings__Default: "Host=db;Port=5432;Database=restaurant;Username=pos;Password=pos_pw"
    ports:
      - "5090:8080"

volumes:
  pos_pgdata:

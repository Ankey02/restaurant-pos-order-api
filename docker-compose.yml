services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # runs on Apple Silicon too (Docker Desktop uses Rosetta)
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pos_Strong_Pw1!"   # local demo only
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - pos_mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables the Scalar UI for demos
      ConnectionStrings__Default: "Server=db,1433;Database=restaurant;User Id=sa;Password=Pos_Strong_Pw1!;TrustServerCertificate=True"
    ports:
      - "5090:8080"

volumes:
  pos_mssqldata:
